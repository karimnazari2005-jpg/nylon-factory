<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14303D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارخانه">
<title>مدیریت کارخانه نایلون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1F4; --surface:#FFFFFF; --ink:#14303D; --text:#14303D; --muted:#5A7480; --line:#D6E1E6;
  --primary:#1B7A9E; --on-primary:#FFFFFF;
  --red:#B93C31; --green:#1F7D57; --gold:#8A6210;
  --t-blue:#DCEEF5; --t-green:#DBEFE4; --t-gold:#FAEDC8; --t-red:#F7DFDB;
  --on-ink:#F1F7F9; --on-ink-muted:#A5BDC7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
    --primary:#5BB8DC; --on-primary:#072028;
    --red:#F0857A; --green:#58C18F; --gold:#F2B632;
    --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
  --primary:#5BB8DC; --on-primary:#072028;
  --red:#F0857A; --green:#58C18F; --gold:#F2B632;
  --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{
  margin:0;background:var(--bg);color:var(--text);
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{display:inline-block;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pos{color:var(--green)}
.neg{color:var(--red)}

.app{max-width:560px;margin:0 auto;padding-bottom:104px}

/* header */
.top{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);padding:22px 20px 66px}
.top.compact{padding:18px 20px 22px}
.roll{position:absolute;left:-96px;top:-84px;width:290px;height:290px;color:#6FC3E3;opacity:.2;pointer-events:none}
.compact .roll{left:-70px;top:-100px;width:210px;height:210px}
.roll svg{width:100%;height:100%}
.top-row{position:relative;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;font-weight:700;line-height:1.5}
.top .date{margin:0;color:var(--on-ink-muted);font-size:13px}
.chip{flex:none;font-size:12px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--on-ink)}
.back{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:var(--on-ink);display:grid;place-items:center;cursor:pointer}

/* account strip */
.accounts{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:-42px 16px 0;background:var(--surface);border-radius:18px;box-shadow:0 8px 24px rgba(10,32,41,.16)}
.acc{padding:14px 16px}
.acc + .acc{border-inline-start:1px solid var(--line)}
button.acc{display:block;border:0;background:none;text-align:start;cursor:pointer}
.acc .lbl{display:block;color:var(--muted);font-size:13px}
.acc b{display:block;font-size:22px;font-weight:700;line-height:1.5}
.cur{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 16px 0}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500;cursor:pointer}

/* blocks and rows */
.block{margin:20px 16px 0}
.block h2{margin:0 0 8px;font-size:15px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > :last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
button.row{cursor:pointer}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.ic .icon{width:20px;height:20px}
.tone-green{background:var(--t-green);color:var(--green)}
.tone-blue{background:var(--t-blue);color:var(--primary)}
.tone-gold{background:var(--t-gold);color:var(--gold)}
.tone-red{background:var(--t-red);color:var(--red)}
.main{flex:1;min-width:0}
.main b{display:block;font-weight:500}
.subs{display:flex;flex-wrap:wrap;gap:0 12px}
.sub{color:var(--muted);font-size:13px}
.amt{flex:none;text-align:end;max-width:52%}
.amt b{display:block;font-weight:700}
.tag{display:inline-block;font-size:12px;line-height:1.7;padding:0 8px;border-radius:999px}
.tag.debt{background:var(--t-red);color:var(--red)}
.tag.paid{background:var(--t-green);color:var(--green)}
.tag.info{background:var(--t-blue);color:var(--primary)}
.tag.warn{background:var(--t-gold);color:var(--gold)}
.chev{width:18px;height:18px;color:var(--muted)}
.chev .icon{width:18px;height:18px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--t-blue);color:var(--primary)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--t-blue);color:var(--primary);margin-top:10px}
.btn.del{background:var(--t-red);color:var(--red)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-radius:14px;background:var(--t-red);color:var(--red)}
.sum.blue{background:var(--t-blue);color:var(--text)}
.sum b{font-size:20px;text-align:end}
.sum b span.blk{display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--t-blue)}
.seg button{padding:8px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700}
.rep{display:grid;grid-template-columns:1.1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}
.c.h{background:var(--t-blue);color:var(--muted);font-size:13px}
.c.l{text-align:start;padding-inline-start:14px;font-weight:500}
.c.res{font-weight:700;border-bottom:0}
.note{margin:10px 2px 0;color:var(--muted);font-size:13px}

/* form */
.form .fld{margin-bottom:16px}
.fld > label,.fld > .lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;line-height:1.5}
.inp.ltr{direction:ltr;text-align:left}
.inp[type="date"]{min-height:48px;text-align:start}
.inp::placeholder{color:var(--muted);opacity:.8}
.rollrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rollrow .hd{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.rollrow .hd b{font-weight:500}
.rollrow .rp{flex:1;text-align:end;font-size:14px}
.mini{display:block;font-size:12.5px;color:var(--muted)}
.mini .inp{margin-top:4px}
.x{width:34px;height:34px;border:0;border-radius:10px;background:var(--t-red);color:var(--red);font-size:20px;line-height:1;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 16px;padding:14px 16px;border-radius:14px;background:var(--t-blue)}
.total b{font-size:24px}
.chips{display:flex;gap:8px;margin-top:8px}
.chips.wrap{flex-wrap:wrap}
.pillbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pillbtn{padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.due{margin:-4px 2px 14px;font-weight:500;min-height:1.7em}
.err{margin:0 0 12px;color:var(--red)}
.err:empty{display:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--t-blue)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ink);color:var(--on-ink);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  var DIG='۰۱۲۳۴۵۶۷۸۹';
  var CUR={AFN:'افغانی',USD:'دالر'};
  var DEFAULT_NAME='کارخانه نایلون';
  var FB={
    apiKey:"AIzaSyDGZgy1wX5CzlSpyb2iYzgMyVXWzDbpPhg",
    authDomain:"nylon-factory.firebaseapp.com",
    projectId:"nylon-factory",
    storageBucket:"nylon-factory.firebasestorage.app",
    messagingSenderId:"72639619280",
    appId:"1:72639619280:web:4f78925d246a738893fed5"
  };

  /* ---------- helpers ---------- */
  function fa(s){return String(s).replace(/\d/g,function(d){return DIG[d]})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(v){return Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2})}
  function N(v){return '<span class="n">'+(v<0?'−':'')+fa(fmt(v))+'</span>'}
  function S(dir,v){return '<span class="n">'+(dir==='in'?'+':'−')+fa(fmt(v))+'</span>'}
  function T(s){return '<span class="n">'+fa(s)+'</span>'}
  function icon(n){return '<svg class="icon" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
  function cur(c){return '<span class="cur">'+c+'</span>'}
  function sum(a,k){return a.reduce(function(t,x){return t+(x[k]||0)},0)}
  function r2(v){return Math.round(v*100)/100}
  function by(arr,f){
    var r={AFN:0,USD:0};
    arr.forEach(function(x){r[x.cur||'AFN']+=f(x)});
    r.AFN=r2(r.AFN);r.USD=r2(r.USD);return r;
  }
  function parse(s){
    s=String(s||'')
      .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
      .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
      .replace(/[,٬،\s]/g,'').replace(/٫/g,'.');
    var v=parseFloat(s);return isFinite(v)?v:0;
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function pad(n){return (n<10?'0':'')+n}
  function timeText(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
  function isToday(ts){return dayKey(ts)===dayKey(Date.now())}
  function dayStart(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
  function daysLeft(ts){return Math.round((dayStart(ts)-dayStart(Date.now()))/864e5)}
  function dateVal(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function dateTs(v){
    var p=String(v||'').split('-');if(p.length!==3)return 0;
    var t=new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime();
    return isFinite(t)?t:0;
  }
  function pdate(ts,o){
    var locs=['fa-AF-u-ca-persian','fa-IR-u-ca-persian'];
    for(var i=0;i<locs.length;i++){
      try{return fa(new Intl.DateTimeFormat(locs[i],o).format(new Date(ts)))}catch(e){}
    }
    return '';
  }
  function dayLabel(ts){
    if(isToday(ts))return 'امروز';
    if(dayKey(ts)===dayKey(Date.now()-864e5))return 'دیروز';
    return pdate(ts,{day:'numeric',month:'long'});
  }
  function monthKey(ts){
    try{return new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric'}).format(new Date(ts))}
    catch(e){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()}
  }

  /* ---------- data (shared between phones through Firebase) ---------- */
  var COLS=['sales','buys','exps','pays','checks','moves'];
  var auth=null,fs=null,user=null,ready=false,sess=0,unsubs=[],synced={},metaSynced='',authState='boot',gateMsg='',role='',profile=null;
  var TYPING={newsale:1,newbuy:1,newexp:1,newcheck:1,newmove:1,openbal:1,settings:1,editpay:1,editcust:1,cust:1,newuser:1,edituser:1};

  function emptyData(){
    return {sample:false,open:{AFN:0,USD:0},seq:1,customers:[],sales:[],buys:[],exps:[],pays:[],checks:[],moves:[],users:[]};
  }
  function localTheme(){try{return localStorage.getItem('nylon-theme')||'auto'}catch(e){return 'auto'}}
  var db=emptyData();
  function ensure(){
    if(!db.pays)db.pays=[];
    if(!db.checks)db.checks=[];
    if(!db.moves)db.moves=[];
    if(!db.open)db.open={AFN:0,USD:0};
    var s=db.settings||{};
    db.settings={name:s.name||DEFAULT_NAME,rate:s.rate||0,theme:s.theme||localTheme()};
  }
  function applyTheme(){
    var t=db.settings.theme,r=document.documentElement;
    if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
    document.title=db.settings.name;
  }
  ensure();applyTheme();

  function balance(c){
    var v=(db.open&&db.open[c])||0;
    db.sales.forEach(function(s){if((s.cur||'AFN')===c)v+=s.paid});
    db.buys.forEach(function(b){if((b.cur||'AFN')===c)v-=b.amt});
    db.exps.forEach(function(x){if((x.cur||'AFN')===c)v-=x.amt});
    db.pays.forEach(function(p){if((p.cur||'AFN')===c)v+=p.amt});
    db.moves.forEach(function(m){if((m.cur||'AFN')===c)v+=(m.dir==='out'?-m.amt:m.amt)});
    return r2(v);
  }
  function custInfo(c){
    var ss=db.sales.filter(function(s){return s.name===c.name});
    var d=by(ss,function(s){return s.total-s.paid});
    db.pays.forEach(function(p){if(p.name===c.name){var k=p.cur||'AFN';d[k]=r2(d[k]-p.amt)}});
    var last=ss.reduce(function(m,s){return Math.max(m,s.ts)},0);
    return {name:c.name,d:d,last:last};
  }
  function totalDebt(){
    var d=by(db.sales,function(s){return s.total-s.paid});
    db.pays.forEach(function(p){var k=p.cur||'AFN';d[k]=r2(d[k]-p.amt)});
    return d;
  }
  function hasDebt(ci){return ci.d.AFN>0||ci.d.USD>0}
  function amts(a,u){
    var out='';
    if(a)out+='<b>'+N(a)+cur(CUR.AFN)+'</b>';
    if(u)out+='<b>'+N(u)+cur(CUR.USD)+'</b>';
    return out||'<b>'+N(0)+cur(CUR.AFN)+'</b>';
  }
  function dueText(d){
    var p=[];
    if(d.AFN>0)p.push(N(d.AFN)+' '+CUR.AFN);

  var EXP_CATS=['معاش','خدمات','حمل','خوراک','تعمیرات','دیگر'];

  /* ---------- sales form ---------- */
  function bindForm(){
    var f=document.getElementById('sf');if(!f)return;
    var sel={cur:'AFN',mode:'roll',unit:'kg'},follow=true,ed=curEdit('sale');
    var rollsEl=f.querySelector('#rolls'),paidEl=f.querySelector('#f-paid'),errEl=f.querySelector('#f-err');
    var defRate=db.settings.rate>0?String(db.settings.rate):'';

    function rows(){return Array.prototype.slice.call(rollsEl.querySelectorAll('.rollrow'))}
    function renumber(){rows().forEach(function(r,i){r.querySelector('.rn').textContent=fa(i+1)})}
    function addRoll(rate){
      var d=document.createElement('div');d.className='rollrow';
      d.innerHTML='<div class="hd"><b>رول <span class="n rn"></span></b><span class="rp muted"></span>'+
        '<button type="button" class="x" data-x aria-label="حذف این رول">×</button></div>'+
        '<label class="mini">وزن (کیلو)<input class="inp rw" inputmode="decimal" autocomplete="off"></label>'+
        '<label class="mini">نرخ هر کیلو<input class="inp rr" inputmode="decimal" autocomplete="off"></label>';
      d.querySelector('.rr').value=rate||'';
      rollsEl.appendChild(d);renumber();
    }
    function applySel(g){
      if(g==='mode'){
        f.querySelector('#sec-roll').hidden=sel.mode!=='roll';
        f.querySelector('#sec-weight').hidden=sel.mode!=='weight';
      }
      if(g==='unit'){
        var u=sel.unit==='ton'?'تُن':'کیلو';
        f.querySelector('#w-qty-l').textContent='مقدار ('+u+')';
        f.querySelector('#w-rate-l').textContent='نرخ هر '+u;
      }
    }
    function calc(){
      var total=0,kg=0,rolls=0,bad=false,items=[];
      if(sel.mode==='roll'){
        rows().forEach(function(r){
          var wi=r.querySelector('.rw'),ri=r.querySelector('.rr'),lp=r.querySelector('.rp');
          var w=parse(wi.value),p=parse(ri.value);
          if(w>0&&p>0){
            var pr=r2(w*p);total+=pr;kg+=w;rolls++;items.push({w:w,rate:p,price:pr});
            lp.innerHTML=N(pr)+cur(CUR[sel.cur]);
          }else{
            lp.textContent='';
            if(wi.value.trim()||ri.value.trim())bad=true;
          }
        });
      }else{
        var q=parse(f.querySelector('#w-qty').value),rt=parse(f.querySelector('#w-rate').value);
        kg=q*(sel.unit==='ton'?1000:1);total=q*rt;
      }
      total=r2(total);kg=r2(kg);
      f.querySelector('#f-total').innerHTML=N(total)+cur(CUR[sel.cur]);
      if(follow)paidEl.value=total>0?String(total):'';
      var paid=parse(paidEl.value),due=r2(total-paid),dueEl=f.querySelector('#f-due');
      if(total>0)dueEl.innerHTML=due>0?'<span class="neg">باقی: '+N(due)+cur(CUR[sel.cur])+'</span>':'<span class="pos">تسویه کامل</span>';
      else dueEl.textContent='';
      return {total:total,kg:kg,rolls:rolls,bad:bad,items:items};
    }
    function saveSale(){
      var name=f.querySelector('#f-cust').value.trim(),r=calc(),paid=r2(parse(paidEl.value)),err='';
      if(!name)err='نام مشتری را بنویس.';
      else if(r.bad)err='برای هر رول، هم وزن و هم نرخ را وارد کن.';
      else if(!(r.total>0))err=sel.mode==='roll'?'حداقل یک رول با وزن و نرخ وارد کن.':'مقدار و نرخ را وارد کن.';
      else if(paid<0||paid>r.total+0.001)err='مبلغ دریافتی باید بین صفر و مجموع باشد.';
      errEl.textContent=err;
      if(err)return;
      var sale={id:ed?ed.id:uid(),ts:ed?ed.ts:Date.now(),name:name,cur:sel.cur,mode:sel.mode,rolls:r.rolls,kg:r.kg,total:r.total,paid:paid};
      if(sel.mode==='roll')sale.items=r.items;
      else{sale.qty=parse(f.querySelector('#w-qty').value);sale.unit=sel.unit;sale.rate=parse(f.querySelector('#w-rate').value)}
      putRec(db.sales,sale);
      addCustomer(name);
      pruneCustomers();persist();state.edit=null;
      toast(ed?'تغییرات ذخیره شد':'فروش ذخیره شد');go(ed?'back':'sales');
    }

    f.addEventListener('input',function(e){
      if(e.target===paidEl)follow=false;
      errEl.textContent='';calc();
    });
    f.addEventListener('click',function(e){
      var sb=e.target.closest('[data-seg] button');
      if(sb){
        var g=sb.parentNode.dataset.seg;sel[g]=sb.dataset.v;
        Array.prototype.forEach.call(sb.parentNode.children,function(b){b.setAttribute('aria-pressed',b===sb?'true':'false')});
        applySel(g);calc();return;
      }
      if(e.target.closest('#add-roll')){
        var rs=rows();addRoll(rs.length?rs[rs.length-1].querySelector('.rr').value:defRate);
        calc();rows().pop().querySelector('.rw').focus();return;
      }
      var x=e.target.closest('[data-x]');
      if(x){
        if(rows().length>1){x.closest('.rollrow').remove();renumber();calc()}
        else toast('حداقل یک رول لازم است');
        return;
      }
      if(e.target.closest('#paid-all')){follow=true;calc();return}
      if(e.target.closest('#paid-none')){follow=false;paidEl.value='0';calc();return}
      var dl=e.target.closest('#f-del');
      if(dl){armDel(dl,function(){dropRec('sales',ed);pruneCustomers();persist();state.edit=null;toast('فروش حذف شد');go('back')});return}
      if(e.target.closest('#f-save'))saveSale();
    });
    if(ed){
      follow=false;
      f.querySelector('#f-cust').value=ed.name;
      sel.cur=ed.cur||'AFN';sel.mode=ed.mode||'weight';sel.unit=ed.unit||'kg';
      ['cur','mode','unit'].forEach(function(g){setSeg(f,g,sel[g])});
      applySel('mode');applySel('unit');
      if(sel.mode==='roll'&&ed.items&&ed.items.length){
        ed.items.forEach(function(it){addRoll(it.rate);rows().pop().querySelector('.rw').value=it.w});
      }
      if(sel.mode==='weight'){
        var q=ed.qty!=null?ed.qty:ed.kg,rt=ed.rate!=null?ed.rate:(ed.kg?Math.round(ed.total/ed.kg*1e6)/1e6:0);
        f.querySelector('#w-qty').value=String(q);f.querySelector('#w-rate').value=String(rt);
      }
      f.querySelector('#f-paid').value=String(ed.paid);
    }else if(defRate){
      f.querySelector('#w-rate').value=defRate;
    }
    if(!rows().length)addRoll(defRate);
    calc();
  }

    f.addEventListener('input',function(){errEl.textContent=''});
    f.addEventListener('click',function(e){
      if(segClick(e,sel))return;
      var dl=e.target.closest('#m-del');
      if(dl){armDel(dl,function(){dropRec('moves',ed);persist();state.edit=null;toast('حذف شد');go('back')});return}
      if(!e.target.closest('#m-save'))return;
      var a=r2(parse(f.querySelector('#m-amt').value)),note=f.querySelector('#m-note').value.trim(),err='';
      if(!(a>0))err='مبلغ را وارد کن.';
      errEl.textContent=err;if(err)return;
      var rec={id:ed?ed.id:uid(),ts:ed?ed.ts:Date.now(),dir:sel.dir,cur:sel.cur,amt:a,note:note};
      putRec(db.moves,rec);
      state.acc=sel.cur;persist();state.edit=null;toast(ed?'تغییرات ذخیره شد':'ذخیره شد');go('back');
    });
    if(ed){f.querySelector('#m-amt').value=String(ed.amt);f.querySelector('#m-note').value=ed.note||''}
  }
  function bindOpen(){
    var f=document.getElementById('of');if(!f)return;
    var errEl=f.querySelector('#o-err');
    f.querySelector('#o-afn').value=String((db.open&&db.open.AFN)||0);
    f.querySelector('#o-usd').value=String((db.open&&db.open.USD)||0);
    f.addEventListener('input',function(){errEl.textContent=''});
    f.addEventListener('click',function(e){
      if(!e.target.closest('#o-save'))return;
      db.open={AFN:r2(parse(f.querySelector('#o-afn').value)),USD:r2(parse(f.querySelector('#o-usd').value))};
      persist();toast('موجودی اول ذخیره شد');go('back');
    });
  }

  /* ---------- settings form ---------- */
  function bindSettings(){
    var f=document.getElementById('sg');if(!f)return;
    var sel={theme:db.settings.theme},errEl=f.querySelector('#s-err');
    setSeg(f,'theme',sel.theme);
    f.addEventListener('input',function(){errEl.textContent=''});
    f.addEventListener('click',function(e){
      if(segClick(e,sel))return;
      if(!e.target.closest('#s-save'))return;
      var name=f.querySelector('#s-name').value.trim()||DEFAULT_NAME;
      var rate=r2(parse(f.querySelector('#s-rate').value));
      if(rate<0){errEl.textContent='قیمت نمی‌تواند منفی باشد.';return}
      db.settings={name:name,rate:rate,theme:sel.theme};
      applyTheme();persist();toast('تنظیمات ذخیره شد');go('back');
    });
  }

  /* ---------- users forms ---------- */
  function createMsg(e){
    var c=(e&&e.code)||'';
    if(c==='auth/email-already-in-use')return 'این ایمیل قبلاً ساخته شده. اگر آن را در Firebase ساخته‌ای، از آنجا حذفش کن و دوباره اینجا بساز.';
    if(c==='auth/invalid-email')return 'ایمیل درست نیست.';
    if(c==='auth/weak-password')return 'رمز باید حداقل ۶ حرف باشد.';
    if(c==='auth/network-request-failed')return 'اینترنت وصل نیست.';
    if(c==='permission-denied')return 'ساختن کاربر فقط برای مدیر ممکن است.';
    return 'ساختن کاربر انجام نشد. دوباره امتحان کن.';
  }
  /* the account is made on a second Firebase app so the manager stays signed in */
  function createAccount(email,pass){
    var app2;
    try{app2=firebase.app('second')}catch(e){app2=firebase.initializeApp(FB,'second')}
    var a2=app2.auth();
    return a2.createUserWithEmailAndPassword(email,pass).then(function(cred){
      var uid=cred.user.uid;
      return a2.signOut().then(function(){return uid},function(){return uid});
    });
  }
  function bindNewUser(){
    var f=document.getElementById('uf');if(!f)return;
    var sel={role:'worker'},errEl=f.querySelector('#u-err'),btn=f.querySelector('#u-btn');
    f.addEventListener('input',function(){errEl.textContent=''});
    f.addEventListener('click',function(e){segClick(e,sel)});
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var nm=f.querySelector('#u-name').value.trim(),em=f.querySelector('#u-email').value.trim().toLowerCase(),pw=f.querySelector('#u-pass').value,err='';
      if(!nm)err='اسم را بنویس.';
      else if(!em)err='ایمیل را بنویس.';
      else if(pw.length<6)err='رمز باید حداقل ۶ حرف باشد.';
      errEl.textContent=err;if(err)return;
      btn.disabled=true;btn.textContent='در حال ساختن...';
      createAccount(em,pw).then(function(uid){
        return fs.collection('users').doc(uid).set({email:em,name:nm,role:sel.role,createdAt:Date.now(),by:user.uid});
      }).then(function(){
        toast('کاربر ساخته شد');go('back');
      }).catch(function(er){
        errEl.textContent=createMsg(er);btn.disabled=false;btn.textContent='ساختن کاربر';
      });
    });
  }
  function bindEditUser(){
    var f=document.getElementById('ue');if(!f)return;
    var u=db.users.filter(function(x){return x.uid===state.uid})[0];if(!u)return;
    var me=user&&u.uid===user.uid,sel={role:u.role==='admin'?'admin':'worker'},errEl=f.querySelector('#ue-err');
    setSeg(f,'role',sel.role);
    f.addEventListener('input',function(){errEl.textContent=''});
    f.addEventListener('click',function(e){
      if(segClick(e,sel))return;
      var dl=e.target.closest('#ue-del');
      if(dl){armDel(dl,function(){
        fs.collection('users').doc(u.uid)['delete']().then(function(){toast('دسترسی قطع شد');go('back')})
          .catch(function(){errEl.textContent='انجام نشد. اینترنت را بررسی کن.'});
      });return}
      if(!e.target.closest('#ue-save'))return;
      var nm=f.querySelector('#ue-name').value.trim();
      if(!nm){errEl.textContent='اسم را بنویس.';return}
      fs.collection('users').doc(u.uid).update({name:nm,role:me?u.role:sel.role})
        .then(function(){toast('ذخیره شد');go('back')})
        .catch(function(){errEl.textContent='انجام نشد. اینترنت را بررسی کن.'});
    });
  }

  /* ---------- login screen ---------- */
  function authMsg(e){
    var c=(e&&e.code)||'';
    if(c==='auth/invalid-email')return 'ایمیل درست نیست.';
    if(c==='auth/network-request-failed')return 'اینترنت وصل نیست.';
    if(c==='auth/too-many-requests')return 'تلاش‌های زیاد. چند دقیقه بعد دوباره امتحان کن.';
    if(c==='auth/user-disabled')return 'این حساب غیرفعال شده.';
    return 'ایمیل یا رمز اشتباه است.';
  }
  function gateView(){
    var head=top(esc(DEFAULT_NAME),{sub:authState==='out'?'ورود به حساب':''});
    if(authState==='out')return head+
      '<form class="block form" id="lf" autocomplete="on" novalidate>'+
        '<div class="fld"><label for="l-email">ایمیل</label>'+
          '<input class="inp ltr" id="l-email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>'+
        '<div class="fld"><label for="l-pass">رمز</label>'+
          '<input class="inp ltr" id="l-pass" type="password" autocomplete="current-password"></div>'+
        '<p class="err" id="l-err" role="alert"></p>'+
        '<button type="submit" class="btn" id="l-btn">ورود</button>'+
        '<p class="note">ایمیل و رمز را مدیر کارخانه به تو می‌دهد.</p>'+
      '</form>';
    if(authState==='error')return head+
      '<div class="block"><div class="empty">'+gateMsg+'</div>'+
      '<button type="button" class="btn ghost" id="l-retry">تلاش دوباره</button>'+
      (user?'<button type="button" class="btn ghost" id="l-out">خروج از حساب</button>':'')+'</div>';
    return head+'<div class="block"><div class="empty">در حال بارگذاری…</div></div>';
  }
  function bindGate(){
    var f=document.getElementById('lf');
    if(f){
      var errEl=f.querySelector('#l-err');
      f.addEventListener('submit',function(e){
        e.preventDefault();
        var em=f.querySelector('#l-email').value.trim(),pw=f.querySelector('#l-pass').value;
        if(!em||!pw){errEl.textContent='ایمیل و رمز را وارد کن.';return}
        var btn=f.querySelector('#l-btn');btn.disabled=true;btn.textContent='در حال ورود...';errEl.textContent='';
        auth.signInWithEmailAndPassword(em,pw).catch(function(err){
          errEl.textContent=authMsg(err);btn.disabled=false;btn.textContent='ورود';
        });
      });
    }
    var rt=document.getElementById('l-retry');
    if(rt)rt.addEventListener('click',function(){location.reload()});
    var lo=document.getElementById('l-out');
    if(lo)lo.addEventListener('click',function(){if(auth)auth.signOut()});
  }

  /* ---------- navigation ---------- */
  function render(){
    var inApp=authState==='in';
    tabbarEl.hidden=!inApp||role==='worker';
    if(!inApp){view.innerHTML=gateView();bindGate();return}
    view.innerHTML=pages[state.page]();
    var here=TAB_OF[state.page];
    Array.prototype.forEach.call(tabsEl.children,function(b){
      if(b.dataset.go===here)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    if(state.page==='newsale')bindForm();
    else if(state.page==='newbuy')bindBuy();
    else if(state.page==='newexp')bindExp();
    else if(state.page==='cust')bindPay();
    else if(state.page==='editpay')bindEditPay();
    else if(state.page==='editcust')bindEditCust();
    else if(state.page==='newcheck')bindCheck();
    else if(state.page==='newmove')bindMove();
    else if(state.page==='openbal')bindOpen();
    else if(state.page==='settings')bindSettings();
    else if(state.page==='newuser')bindNewUser();
    else if(state.page==='edituser')bindEditUser();
  }
  var WORKER_OK={home:1,newsale:1,newbuy:1,newexp:1};
  function go(p){
    var back=(p==='back');
    if(back)p=state.stack.pop()||'home';
    if(role==='worker'&&!WORKER_OK[p]){p='home';state.stack=[]}
    else if(!back){
      if(ROOT[p])state.stack=[];else state.stack.push(state.page);
    }
    state.page=p;render();window.scrollTo(0,0);
  }
  function toast(msg){
    toastEl.textContent=msg;toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2400);
  }

  document.addEventListener('click',function(e){
    if(authState!=='in')return;
    var ed=e.target.closest('[data-edit]');
    if(ed){var pr=ed.dataset.edit.split(':');state.edit={type:pr[0],id:pr[1]};go({sale:'newsale',buy:'newbuy',exp:'newexp',pay:'editpay',check:'newcheck',move:'newmove'}[pr[0]]);return}
    var g=e.target.closest('[data-go]');
    if(g){
      state.edit=null;
      if(g.dataset.cust!==undefined)state.cust=g.dataset.cust;
      if(g.dataset.acc!==undefined)state.acc=g.dataset.acc;
      if(g.dataset.dir!==undefined)state.dir=g.dataset.dir;
      if(g.dataset.uid!==undefined)state.uid=g.dataset.uid;
      go(g.dataset.go);return;
    }
    var ac=e.target.closest('[data-acc]');if(ac){state.acc=ac.dataset.acc;render();return}
    var t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
    var r=e.target.closest('[data-rep]');if(r){state.rep=r.dataset.rep;render();return}
    var a=e.target.closest('[data-action]');
    if(a&&a.dataset.action==='logout'){
      if(window.confirm('از حساب خارج می‌شوی؟')&&auth)auth.signOut();
    }
  });

  /* ---------- cloud: shared data through Firebase ---------- */
  /* every record is its own document in Firestore, so two phones can
     add records at the same time without overwriting each other */
  function stable(o){
    if(o===null||typeof o!=='object')return JSON.stringify(o);
    if(Array.isArray(o))return '['+o.map(stable).join(',')+']';
    return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stable(o[k])}).join(',')+'}';
  }
  function clean(x){return JSON.parse(JSON.stringify(x))}
  function cid(x){return String(x.id)}
  function metaObj(){
    return {open:{AFN:(db.open&&db.open.AFN)||0,USD:(db.open&&db.open.USD)||0},name:db.settings.name,rate:db.settings.rate||0};
  }

  /* called after every change: sends only what changed to the server */
  function persist(){
    try{localStorage.setItem('nylon-theme',db.settings.theme)}catch(e){}
    if(!fs||!user||!ready)return;
    var ops=[];
    COLS.forEach(function(c){
      var local={},prev=synced[c]||{};
      db[c].forEach(function(x){
        var o=clean(x),k=cid(x),s=stable(o);
        local[k]=s;
        if(prev[k]!==s)ops.push({t:'set',ref:fs.collection(c).doc(k),data:o});
      });
      Object.keys(prev).forEach(function(k){
        if(!(k in local))ops.push({t:'del',ref:fs.collection(c).doc(k)});
      });
      synced[c]=local;
    });
    if(role==='admin'){
      var meta=clean(metaObj()),ms=stable(meta);
      if(ms!==metaSynced){ops.push({t:'set',ref:fs.collection('meta').doc('main'),data:meta});metaSynced=ms}
    }
    for(var i=0;i<ops.length;i+=400){
      var b=fs.batch();
      ops.slice(i,i+400).forEach(function(o){if(o.t==='set')b.set(o.ref,o.data);else b['delete'](o.ref)});
      b.commit().catch(function(){toast('ذخیره در سرور نشد. اینترنت را بررسی کن')});
    }
  }

  /* screen refresh after data arrives from another phone */
  function refresh(){
    if(!ready||authState!=='in')return;
    applyTheme();
    if(!TYPING[state.page])render();
  }
  function syncErr(err){
    if(!user||authState==='error')return;
    var c=(err&&err.code)||'';
    gateMsg=c==='permission-denied'?'دسترسی این حساب بسته شده است. با مدیر صحبت کن.':'ارتباط با سرور برقرار نشد. اینترنت را بررسی کن.';
    authState='error';ready=false;render();
  }
  function errH(my){return function(err){if(my===sess)syncErr(err)}}

  function stopSync(){
    sess++;
    unsubs.forEach(function(u){try{u()}catch(e){}});
    unsubs=[];synced={};metaSynced='';ready=false;role='';profile=null;
    db=emptyData();ensure();applyTheme();
  }
  function startSync(){
    var my=++sess;
    /* a worker only writes new records; nothing is read back */
    if(role==='worker'){ready=true;authState='in';applyTheme();render();return}
    var pending=COLS.length+2;
    function fin(){
      pending--;
      if(pending===0){ready=true;authState='in';applyTheme();render()}
    }
    COLS.forEach(function(c){
      var first=true;
      unsubs.push(fs.collection(c).onSnapshot(function(snap){
        if(my!==sess)return;
        var old={},arr=[],map={},changed=snap.size!==db[c].length;
        db[c].forEach(function(x){old[cid(x)]=x});
        snap.forEach(function(d){
          var o=d.data(),k=d.id,s=stable(o),p=old[k];
          map[k]=s;
          if(p&&stable(clean(p))===s)arr.push(p);
          else{arr.push(o);changed=true}
        });
        db[c]=arr;synced[c]=map;rebuildCustomers();
        if(first){first=false;fin()}
        else if(changed)refresh();
      },errH(my)));
    });
    var mfirst=true;
    unsubs.push(fs.collection('meta').doc('main').onSnapshot(function(d){
      if(my!==sess)return;
      var m=d.exists?d.data():{},o=m.open||{};
      db.open={AFN:+o.AFN||0,USD:+o.USD||0};
      db.settings.name=m.name||DEFAULT_NAME;
      db.settings.rate=+m.rate||0;
      var ms=stable(clean(metaObj())),changed=ms!==metaSynced;
      metaSynced=ms;
      if(mfirst){mfirst=false;fin()}
      else if(changed)refresh();
    },errH(my)));
    var ufirst=true;
    unsubs.push(fs.collection('users').onSnapshot(function(snap){
      if(my!==sess)return;
      var arr=[];
      snap.forEach(function(d){var o=d.data();o.uid=d.id;arr.push(o)});
      var changed=stable(clean(arr))!==stable(clean(db.users));
      db.users=arr;
      if(ufirst){ufirst=false;fin()}
      else if(changed)refresh();
    },errH(my)));
  }

  /* read this person's role; the very first person to sign in becomes the manager */
  function loadProfile(u){
    return fs.collection('users').doc(u.uid).get().then(function(d){
      if(d.exists)return d.data();
      var prof={email:u.email||'',name:'مدیر',role:'admin',createdAt:Date.now()};
      var b=fs.batch();
      b.set(fs.collection('users').doc(u.uid),prof);
      b.set(fs.collection('config').doc('setup'),{owner:u.uid,at:Date.now()});
      return b.commit().then(function(){return prof});
    });
  }
  function profileErr(err){
    var c=(err&&err.code)||'';
    gateMsg=(c==='unavailable')?'ارتباط با سرور برقرار نشد. اینترنت را بررسی کن.':'حساب تو هنوز فعال نشده. از مدیر بخواه برایت کاربر بسازد.';
    authState='error';ready=false;render();
  }

  function initCloud(){
    if(typeof firebase==='undefined'){
      authState='error';gateMsg='اتصال به سرور برقرار نشد. اینترنت را بررسی کن و دوباره تلاش کن.';render();return;
    }
    try{
      firebase.initializeApp(FB);
      auth=firebase.auth();
      fs=firebase.firestore();
      try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    }catch(e){
      authState='error';gateMsg='راه‌اندازی برنامه ناموفق بود. صفحه را دوباره باز کن.';render();return;
    }
    render();
    auth.onAuthStateChanged(function(u){
      stopSync();user=u;
      state.page='home';state.stack=[];state.edit=null;
      if(u){
        authState='sync';render();
        loadProfile(u).then(function(p){
          if(!user||user.uid!==u.uid)return;
          profile=p;
          role=p.role==='worker'?'worker':(p.role==='admin'?'admin':'');
          if(!role){profileErr({code:'no-role'});return}
          startSync();
        }).catch(function(err){
          if(user&&user.uid===u.uid)profileErr(err);
        });
      }else{authState='out';render()}
    });
  }

  initCloud();
})();
</script>

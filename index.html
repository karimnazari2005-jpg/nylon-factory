<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14303D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارخانه">
<title>مدیریت کارخانه نایلون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1F4; --surface:#FFFFFF; --ink:#14303D; --text:#14303D; --muted:#5A7480; --line:#D6E1E6;
  --primary:#1B7A9E; --on-primary:#FFFFFF;
  --red:#B93C31; --green:#1F7D57; --gold:#8A6210;
  --t-blue:#DCEEF5; --t-green:#DBEFE4; --t-gold:#FAEDC8; --t-red:#F7DFDB;
  --on-ink:#F1F7F9; --on-ink-muted:#A5BDC7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
    --primary:#5BB8DC; --on-primary:#072028;
    --red:#F0857A; --green:#58C18F; --gold:#F2B632;
    --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
  --primary:#5BB8DC; --on-primary:#072028;
  --red:#F0857A; --green:#58C18F; --gold:#F2B632;
  --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{
  margin:0;background:var(--bg);color:var(--text);
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{display:inline-block;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pos{color:var(--green)}
.neg{color:var(--red)}

.app{max-width:560px;margin:0 auto;padding-bottom:104px}

/* header */
.top{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);padding:22px 20px 66px}
.top.compact{padding:18px 20px 22px}
.roll{position:absolute;left:-96px;top:-84px;width:290px;height:290px;color:#6FC3E3;opacity:.2;pointer-events:none}
.compact .roll{left:-70px;top:-100px;width:210px;height:210px}
.roll svg{width:100%;height:100%}
.top-row{position:relative;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;font-weight:700;line-height:1.5}
.top .date{margin:0;color:var(--on-ink-muted);font-size:13px}
.chip{flex:none;font-size:12px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--on-ink)}
.back{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:var(--on-ink);display:grid;place-items:center;cursor:pointer}

/* account strip */
.accounts{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:-42px 16px 0;background:var(--surface);border-radius:18px;box-shadow:0 8px 24px rgba(10,32,41,.16)}
.acc{padding:14px 16px}
.acc + .acc{border-inline-start:1px solid var(--line)}
button.acc{display:block;border:0;background:none;text-align:start;cursor:pointer}
.acc .lbl{display:block;color:var(--muted);font-size:13px}
.acc b{display:block;font-size:22px;font-weight:700;line-height:1.5}
.cur{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 16px 0}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500;cursor:pointer}

/* blocks and rows */
.block{margin:20px 16px 0}
.block h2{margin:0 0 8px;font-size:15px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > :last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
button.row{cursor:pointer}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.ic .icon{width:20px;height:20px}
.tone-green{background:var(--t-green);color:var(--green)}
.tone-blue{background:var(--t-blue);color:var(--primary)}
.tone-gold{background:var(--t-gold);color:var(--gold)}
.tone-red{background:var(--t-red);color:var(--red)}
.main{flex:1;min-width:0}
.main b{display:block;font-weight:500}
.subs{display:flex;flex-wrap:wrap;gap:0 12px}
.sub{color:var(--muted);font-size:13px}
.amt{flex:none;text-align:end;max-width:52%}
.amt b{display:block;font-weight:700}
.tag{display:inline-block;font-size:12px;line-height:1.7;padding:0 8px;border-radius:999px}
.tag.debt{background:var(--t-red);color:var(--red)}
.tag.paid{background:var(--t-green);color:var(--green)}
.tag.info{background:var(--t-blue);color:var(--primary)}
.tag.warn{background:var(--t-gold);color:var(--gold)}
.chev{width:18px;height:18px;color:var(--muted)}
.chev .icon{width:18px;height:18px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--t-blue);color:var(--primary)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--t-blue);color:var(--primary);margin-top:10px}
.btn.del{background:var(--t-red);color:var(--red)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-radius:14px;background:var(--t-red);color:var(--red)}
.sum.blue{background:var(--t-blue);color:var(--text)}
.sum b{font-size:20px;text-align:end}
.sum b span.blk{display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--t-blue)}
.seg button{padding:8px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700}
.rep{display:grid;grid-template-columns:1.1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}
.c.h{background:var(--t-blue);color:var(--muted);font-size:13px}
.c.l{text-align:start;padding-inline-start:14px;font-weight:500}
.c.res{font-weight:700;border-bottom:0}
.note{margin:10px 2px 0;color:var(--muted);font-size:13px}
.daynav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.daynav button{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;cursor:pointer;min-height:52px}
.daynav button:disabled{opacity:.4;cursor:default}
.daymid{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:center}
.daymid b{font-weight:700}
.daymid input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0}

/* form */
.form .fld{margin-bottom:16px}
.fld > label,.fld > .lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;line-height:1.5}
.inp.ltr{direction:ltr;text-align:left}
.inp[type="date"]{min-height:48px;text-align:start}
.inp::placeholder{color:var(--muted);opacity:.8}
.rollrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rollrow .hd{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.rollrow .hd b{font-weight:500}
.rollrow .rp{flex:1;text-align:end;font-size:14px}
.mini{display:block;font-size:12.5px;color:var(--muted)}
.mini .inp{margin-top:4px}
.x{width:34px;height:34px;border:0;border-radius:10px;background:var(--t-red);color:var(--red);font-size:20px;line-height:1;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 16px;padding:14px 16px;border-radius:14px;background:var(--t-blue)}
.total b{font-size:24px}
.chips{display:flex;gap:8px;margin-top:8px}
.chips.wrap{flex-wrap:wrap}
.pillbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pillbtn{padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.due{margin:-4px 2px 14px;font-weight:500;min-height:1.7em}
.err{margin:0 0 12px;color:var(--red)}
.err:empty{display:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--t-blue)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ink);color:var(--on-ink);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* logo and profile */
.logo{flex:none;width:44px;height:44px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.12)}
.logo.big{width:72px;height:72px;border-radius:18px}
.logo.ph{display:grid;place-items:center;background:var(--t-blue);color:var(--primary)}
.logo.ph .icon{width:30px;height:30px}
.profrow{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.profrow .btns{flex:1;display:grid;gap:8px}
.profrow .btn{margin-top:0}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c,#1B7A9E)}
.sw[aria-pressed="true"]{border-color:var(--text)}

/* futuristic dark glass theme */
:root[data-theme="neon"]{
  --bg:#070B1A; --surface:rgba(18,28,58,.62); --ink:#070B1A; --text:#EAF6FF; --muted:#8FA9C4; --line:rgba(110,190,255,.20);
  --primary:#37E1FF; --on-primary:#04121C;
  --red:#FF6F91; --green:#3DF2B0; --gold:#FFC857;
  --t-blue:rgba(55,225,255,.14); --t-green:rgba(61,242,176,.14); --t-gold:rgba(255,200,87,.14); --t-red:rgba(255,111,145,.14);
  --on-ink:#EAF6FF; --on-ink-muted:#8FA9C4;
}
:root[data-theme="neon"] body{background:transparent}
:root[data-theme="neon"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 85% 0%,rgba(55,225,255,.22),transparent 70%),radial-gradient(50% 40% at 0% 32%,rgba(124,92,255,.22),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(0,255,190,.10),transparent 70%)}
:root[data-theme="neon"] .top{background:linear-gradient(160deg,rgba(10,20,50,.96),rgba(11,36,71,.93));border-bottom:1px solid var(--line);box-shadow:0 8px 40px rgba(55,225,255,.12)}
:root[data-theme="neon"] .roll{color:#37E1FF;opacity:.32}
:root[data-theme="neon"] .top h1{text-shadow:0 0 18px rgba(55,225,255,.55)}
:root[data-theme="neon"] .list,
:root[data-theme="neon"] .accounts,
:root[data-theme="neon"] .qa,
:root[data-theme="neon"] .rep,
:root[data-theme="neon"] .empty,
:root[data-theme="neon"] .sum,
:root[data-theme="neon"] .total,
:root[data-theme="neon"] .daymid,
:root[data-theme="neon"] .daynav button,
:root[data-theme="neon"] .inp,
:root[data-theme="neon"] .pillbtn{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
:root[data-theme="neon"] .accounts{box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.45),0 0 34px rgba(55,225,255,.12)}
:root[data-theme="neon"] .list,:root[data-theme="neon"] .qa,:root[data-theme="neon"] .rep{box-shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme="neon"] .acc b,:root[data-theme="neon"] .sum b{text-shadow:0 0 12px rgba(55,225,255,.35)}
:root[data-theme="neon"] .btn:not(.ghost):not(.del){background:linear-gradient(135deg,#37E1FF,#6C7BFF);color:#04121C;box-shadow:0 0 22px rgba(55,225,255,.4)}
:root[data-theme="neon"] .tabbar{background:rgba(8,14,34,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
:root[data-theme="neon"] .tab[aria-current="page"] .pill{background:rgba(55,225,255,.16);box-shadow:0 0 18px rgba(55,225,255,.45)}
:root[data-theme="neon"] .seg{background:rgba(255,255,255,.06)}
:root[data-theme="neon"] .seg button[aria-pressed="true"]{background:rgba(55,225,255,.2);color:var(--text);box-shadow:0 0 12px rgba(55,225,255,.25)}
:root[data-theme="neon"] .inp{background:rgba(255,255,255,.05)}
:root[data-theme="neon"] .toast{background:rgba(8,14,34,.92)}
/* berlian theme (purple and navy) */
:root[data-theme="berlian"]{
  --bg:#EEF0FB; --surface:#FFFFFF; --ink:#141B4D; --text:#1B2150; --muted:#6B7390; --line:#E3E6F5;
  --primary:#6C4DF6; --on-primary:#FFFFFF;
  --red:#E5484D; --green:#12A66A; --gold:#C77A05;
  --t-blue:#ECE8FE; --t-green:#DDF5EA; --t-gold:#FFF0D6; --t-red:#FDE4E4;
  --on-ink:#F3F4FF; --on-ink-muted:#A9B0DA;
}
:root[data-theme="berlian"] .top{background:linear-gradient(135deg,#141B4D,#232C7A)}
:root[data-theme="berlian"] .roll{color:#9C86FF}
:root[data-theme="berlian"] .tab[aria-current="page"] .pill{background:#ECE8FE}

/* dashboard */
.sidenav{display:none}
.dash{padding-bottom:8px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 14px rgba(20,27,77,.06)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chd h3{margin:0;font-size:15px;font-weight:700}
.lnk{border:0;background:none;color:var(--primary);font-size:13px;cursor:pointer;padding:0}
.dtop{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 12px rgba(20,27,77,.06)}
.dt-date b{display:block;font-size:14px;line-height:1.4}
.dt-date span{font-size:12px;color:var(--muted)}
.dt-search{flex:1;min-width:0;position:relative;margin:0}
.dt-search input{width:100%;box-sizing:border-box;padding:9px 38px 9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.dt-search .icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.dt-ic{position:relative;flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.dt-badge{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;line-height:1}
.dt-user{display:flex;align-items:center;gap:8px;flex:none}
.dt-user .avatar{width:38px;height:38px}
.dt-user div{line-height:1.3}
.dt-user b{display:block;font-size:13px}
.dt-user span{font-size:11.5px;color:var(--muted)}
.hello{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:18px;padding:22px 20px;background:linear-gradient(100deg,var(--t-blue),var(--surface));border:1px solid var(--line);min-height:92px;display:flex;align-items:center}
.hello h2{margin:0;font-size:22px}
.hello p{margin:4px 0 0;color:var(--muted)}
.hello .art{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:170px;color:var(--primary);opacity:.3;pointer-events:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
.stats .stat:last-child{grid-column:1/-1}
.stat{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border:0;border-radius:18px;color:#fff;text-align:start;cursor:pointer;overflow:hidden;min-height:96px}
.sic{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.sbody{min-width:0;flex:1}
.slbl{display:block;font-size:13px;opacity:.92}
.sval b{display:block;font-size:20px;line-height:1.45}
.sval .cur{color:rgba(255,255,255,.85)}
.sdelta{display:inline-block;margin-top:2px;font-size:12px;background:rgba(255,255,255,.2);border-radius:999px;padding:0 8px}
.s-purple{background:linear-gradient(135deg,#8A5CFF,#5B3DE0)}
.s-green{background:linear-gradient(135deg,#22C55E,#0E9F5A)}
.s-blue{background:linear-gradient(135deg,#3B8CF7,#1D6BE0)}
.s-orange{background:linear-gradient(135deg,#FFB020,#F5820A)}
.s-red{background:linear-gradient(135deg,#FF6B6B,#E5484D)}
.g3{display:grid;gap:14px;margin:14px 16px 0;grid-template-columns:1fr}
.c-line{order:-1}
.chart{width:100%;height:auto;display:block;direction:ltr}
.gl{stroke:var(--line);stroke-width:1}
.gt{fill:var(--muted);font-size:11px;font-family:inherit}
.dt1{fill:var(--text);font-size:16px;font-weight:700;font-family:inherit}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.lgd i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.dn{display:flex;align-items:center;gap:14px}
.donut{width:136px;height:136px;flex:none;direction:ltr}
.lg{flex:1;min-width:0;display:grid;gap:8px}
.lg div{display:flex;align-items:center;font-size:13px}
.lg span.p{margin-inline-start:auto;color:var(--muted)}
.segs{width:150px}
.big{font-size:30px;font-weight:700;line-height:1.3}
.prog{height:8px;border-radius:6px;background:var(--t-blue);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#1DB96B,#2F80ED);border-radius:6px}
.c-today .art2{position:absolute;left:-34px;bottom:-34px;width:150px;color:var(--primary);opacity:.18;pointer-events:none}
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 16px 0}

}

<script>
(function(){
  var DIG='۰۱۲۳۴۵۶۷۸۹';
  var CUR={AFN:'افغانی',USD:'دالر'};
  var DEFAULT_NAME='کارخانه نایلون';
  var FB={
    apiKey:"AIzaSyDGZgy1wX5CzlSpyb2iYzgMyVXWzDbpPhg",
    authDomain:"nylon-factory.firebaseapp.com",
    projectId:"nylon-factory",
    storageBucket:"nylon-factory.firebasestorage.app",
    messagingSenderId:"72639619280",
    appId:"1:72639619280:web:4f78925d246a738893fed5"
  };

  /* ---------- helpers ---------- */
  function fa(s){return String(s).replace(/\d/g,function(d){return DIG[d]})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(v){return Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2})}
  function N(v){return '<span class="n">'+(v<0?'−':'')+fa(fmt(v))+'</span>'}
  function S(dir,v){return '<span class="n">'+(dir==='in'?'+':'−')+fa(fmt(v))+'</span>'}
  function T(s){return '<span class="n">'+fa(s)+'</span>'}
  function icon(n){return '<svg class="icon" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
  function cur(c){return '<span class="cur">'+c+'</span>'}
  function sum(a,k){return a.reduce(function(t,x){return t+(x[k]||0)},0)}
  function r2(v){return Math.round(v*100)/100}
  function by(arr,f){
    var r={AFN:0,USD:0};
    arr.forEach(function(x){r[x.cur||'AFN']+=f(x)});
    r.AFN=r2(r.AFN);r.USD=r2(r.USD);return r;
  }
  function parse(s){
    s=String(s||'')
      .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
      .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
      .replace(/[,٬،\s]/g,'').replace(/٫/g,'.');
    var v=parseFloat(s);return isFinite(v)?v:0;
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function pad(n){return (n<10?'0':'')+n}
  function timeText(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
  function isToday(ts){return dayKey(ts)===dayKey(Date.now())}
  function dayStart(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
  function daysLeft(ts){return Math.round((dayStart(ts)-dayStart(Date.now()))/864e5)}
  function dateVal(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function dateTs(v){
    var p=String(v||'').split('-');if(p.length!==3)return 0;
    var t=new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime();
    return isFinite(t)?t:0;
  }
  function pdate(ts,o){
    var locs=['fa-AF-u-ca-persian','fa-IR-u-ca-persian'];
    for(var i=0;i<locs.length;i++){
      try{return fa(new Intl.DateTimeFormat(locs[i],o).format(new Date(ts)))}catch(e){}
    }
    return '';
  }
  function dayLabel(ts){
    if(isToday(ts))return 'امروز';
    if(dayKey(ts)===dayKey(Date.now()-864e5))return 'دیروز';
    return pdate(ts,{day:'numeric',month:'long'});
  }
  /* a timestamp on a chosen day (yyyy-mm-dd) with the current time of day */
  function tsOnDay(v){
    var p=String(v||'').split('-');if(p.length!==3)return 0;
    var n=new Date();
    var t=new Date(+p[0],+p[1]-1,+p[2],n.getHours(),n.getMinutes(),n.getSeconds()).getTime();
    return isFinite(t)?t:0;
  }
  function pickTs(v,old){
    if(old&&dateVal(old)===v)return old;
    return tsOnDay(v)||old||Date.now();
  }
  function dateFld(id,w){
    return '<div class="fld"><label for="'+id+'">تاریخ</label><input class="inp" type="date" id="'+id+'"><div class="due" id="'+w+'"></div></div>';
  }
  function bindDate(f,idInput,idWhen,ts){
    var d=f.querySelector(idInput),w=f.querySelector(idWhen);
    d.max=dateVal(Date.now());d.value=dateVal(ts);
    function upd(){var t=dateTs(d.value);w.textContent=t?fullDate(t)+' — '+pdate(t,{weekday:'long'}):''}
    d.addEventListener('input',upd);d.addEventListener('change',upd);upd();
    return d;
  }
  function pDayNum(ts){
    try{var p={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{day:'numeric'}).formatToParts(new Date(ts)).forEach(function(x){p[x.type]=x.value});return +p.day}
    catch(e){return new Date(ts).getDate()}
  }
  function weekdayShort(ts){
    try{return new Intl.DateTimeFormat('fa-AF-u-ca-persian',{weekday:'short'}).format(new Date(ts))}catch(e){return ''}
  }
  function pct(now,prev){if(!prev)return null;return Math.round((now-prev)/prev*100)}
  /* AFN sales total on a given day, used for the home charts */
  function dayAFN(ts){
    var k=dayKey(ts);
    return r2(db.sales.reduce(function(t,s){return dayKey(s.ts)===k&&(s.cur||'AFN')==='AFN'?t+s.total:t},0));
  }
  function dailyTotals(n){
    var arr=[];
    for(var i=n-1;i>=0;i--){
      var ts=dayStart(Date.now())-i*864e5+12*36e5;
      arr.push({ts:ts,val:dayAFN(ts)});
    }
    return arr;
  }
  function svgArea(data){
    var w=300,h=110,max=Math.max.apply(null,data.map(function(d){return d.val}))||1;
    var stepX=data.length>1?w/(data.length-1):0;
    var pts=data.map(function(d,i){return [i*stepX,h-2-(d.val/max*(h-14))]});
    var line=pts.map(function(p,i){return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
    var area=line+' L'+w+','+h+' L0,'+h+' Z';
    var dots=pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2"/>'}).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" class="wchart" aria-hidden="true">'+
      '<path class="area" d="'+area+'"/><path class="line" d="'+line+'"/>'+dots+'</svg>';
  }
  function weekChart(){
    var data=dailyTotals(7);
    return '<div class="chartcard"><h2>نمودار فروش ۷ روز اخیر</h2><p class="sub2">افغانی</p>'+
      svgArea(data)+'<div class="wk">'+data.map(function(d){return '<span>'+esc(weekdayShort(d.ts))+'</span>'}).join('')+'</div></div>';
  }
  function monthChart(){
    var data=dailyTotals(30),max=Math.max.apply(null,data.map(function(d){return d.val}))||1;
    var bars=data.map(function(d){return '<b style="height:'+Math.max(4,Math.round(d.val/max*100))+'%" title="'+fullDate(d.ts)+'"></b>'}).join('');
    var lbls=data.map(function(d,i){return '<span>'+((i%5===0||i===data.length-1)?fa(pDayNum(d.ts)):'')+'</span>'}).join('');
    return '<div class="chartcard"><h2>فروش ۳۰ روز اخیر</h2><p class="sub2">افغانی، بر اساس تاریخ شمسی</p>'+
      '<div class="bars">'+bars+'</div><div class="barlbl">'+lbls+'</div></div>';
  }
  /* full date like ۱۴۰۵/۰۵/۰۵ */
  function fullDate(ts){
    try{
      var p={};
      new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(ts)).forEach(function(x){p[x.type]=x.value});
      return fa(String(p.year).replace(/\D/g,'')+'/'+pad(+p.month)+'/'+pad(+p.day));
    }catch(e){return ''}
  }
  function dayHead(ts){
    var pre=isToday(ts)?'امروز، ':(dayKey(ts)===dayKey(Date.now()-864e5)?'دیروز، ':'');
    return pre+'<span class="n">'+fullDate(ts)+'</span>';
  }
  /* sale price per kg: the roll price if all rolls have the same price, otherwise the average */
  function buyKg(b){return b.kg!=null?b.kg:r2((b.ton||0)*1000)}
  function saleRate(s){
    var it=s.items;
    if(it&&it.length&&it.every(function(x){return x.rate===it[0].rate}))return it[0].rate;
    return s.kg>0?r2(s.total/s.kg):0;
  }
  function monthKey(ts){
    try{return new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric'}).format(new Date(ts))}
    catch(e){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()}
  }

  /* ---------- data (shared between phones through Firebase) ---------- */
  var COLS=['sales','buys','exps','pays','checks','moves','employees','salaries','orders'];
  var auth=null,fs=null,user=null,ready=false,sess=0,unsubs=[],synced={},metaSynced='',authState='boot',gateMsg='',role='',profile=null;
  var TYPING={newsale:1,newbuy:1,newexp:1,newcheck:1,newmove:1,openbal:1,settings:1,editpay:1,editcust:1,cust:1,newuser:1,edituser:1,customers:1,newemp:1,empfile:1,newsalary:1};

  function emptyData(){
    return {sample:false,open:{AFN:0,USD:0},seq:1,customers:[],sales:[],buys:[],exps:[],pays:[],checks:[],moves:[],users:[],employees:[],salaries:[],orders:[]};
  }
  function normTheme(t){return (t==='light'||t==='dark'||t==='neon'||t==='berlian')?t:'berlian'}
  function localTheme(){try{return normTheme(localStorage.getItem('nylon-theme'))}catch(e){return 'berlian'}}
  function localAccent(){try{return localStorage.getItem('nylon-accent')||''}catch(e){return ''}}
  function savePrefs(){try{localStorage.setItem('nylon-theme',db.settings.theme);localStorage.setItem('nylon-accent',db.settings.accent||'')}catch(e){}}
  function cacheBrand(){try{localStorage.setItem('nylon-brand',JSON.stringify({name:db.settings.name,logo:db.settings.logo||''}))}catch(e){}}
  function brand(){
    try{var b=JSON.parse(localStorage.getItem('nylon-brand')||'null');if(b&&typeof b==='object')return b}catch(e){}
    return {name:DEFAULT_NAME,logo:''};
  }
  var db=emptyData();
  function ensure(){
    if(!db.pays)db.pays=[];
    if(!db.checks)db.checks=[];
    if(!db.moves)db.moves=[];
    if(!db.open)db.open={AFN:0,USD:0};
    var s=db.settings||{};
    db.settings={name:s.name||DEFAULT_NAME,rate:s.rate||0,theme:s.theme?normTheme(s.theme):localTheme(),accent:(s.accent!==undefined?s.accent:localAccent()),phone:s.phone||'',address:s.address||'',logo:s.logo||'',target:s.target||0};
  }
  function hex2rgb(h){h=String(h).replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
  function mixc(a,b,t){return a.map(function(v,i){return Math.round(v*(1-t)+b[i]*t)})}
  function rgb2hex(c){return '#'+c.map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('')}
  function lum(c){return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
  function isDarkNow(){
    var t=db.settings.theme;
    if(t==='dark'||t==='neon')return true;
    return false;
  }
  /* the chosen app color replaces the main blue */
  function applyAccent(){
    var st=document.documentElement.style,a=db.settings.accent;
    if(!a){['--primary','--on-primary','--t-blue'].forEach(function(p){st.removeProperty(p)});return}
    var rgb=hex2rgb(a),dark=isDarkNow();
    var prim=dark?mixc(rgb,[255,255,255],0.25):rgb;
    st.setProperty('--primary',rgb2hex(prim));
    st.setProperty('--on-primary',lum(prim)>0.6?'#072028':'#FFFFFF');
    st.setProperty('--t-blue',rgb2hex(dark?mixc(rgb,[21,37,45],0.78):mixc(rgb,[255,255,255],0.86)));
  }
  function applyTheme(){
    var t=db.settings.theme,r=document.documentElement;
    if(t==='light'||t==='dark'||t==='neon'||t==='berlian')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
    document.title=db.settings.name;

  var CH=['#2F80ED','#1DB96B','#FF9F1A','#7C4DFF','#9AA3B2','#FF5A5F'];
  function nice(max){
    if(!(max>0))return 1;
    var p=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)),m=max/p;
    return (m<=1?1:m<=2?2:m<=5?5:10)*p;
  }
  function short(v){
    if(v>=1e6)return fa(String(Math.round(v/1e5)/10))+'M';
    if(v>=1e3)return fa(String(Math.round(v/100)/10))+'K';
    return fa(String(Math.round(v*10)/10));
  }
  function dayTs(off){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d.getTime()}
  function jday(ts){return fa(String(+jdate(ts).split('/')[2]))}
  function lineChart(labels,series){
    var W=560,H=230,L=46,R=14,T0=14,B=30,iw=W-L-R,ih=H-T0-B;
    var max=nice(Math.max.apply(null,[0].concat(series.map(function(s){return Math.max.apply(null,s.vals)}))));
    var n=labels.length,step=n>1?iw/(n-1):0,g='';
    function X(i){return L+i*step}
    function Y(v){return T0+ih-(v/max)*ih}
    for(var i=0;i<=4;i++){
      var y=Y(max*i/4);
      g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="gt">'+short(max*i/4)+'</text>';
    }
    labels.forEach(function(lb,i){g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="gt">'+lb+'</text>'});
    series.forEach(function(s){
      var pts=s.vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)});
      g+='<path d="M'+X(0).toFixed(1)+','+(T0+ih)+' L'+pts.join(' L')+' L'+X(n-1).toFixed(1)+','+(T0+ih)+' Z" fill="'+s.color+'" opacity=".12"/>'+
        '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      s.vals.forEach(function(v,i){g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'});
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="نمودار">'+g+'</svg>';
  }
  function barChart(labels,series){
    var W=560,H=210,L=46,R=10,T0=10,B=26,iw=W-L-R,ih=H-T0-B;
    var max=nice(Math.max.apply(null,[0].concat(series.map(function(s){return Math.max.apply(null,s.vals)}))));
    var n=labels.length,gw=iw/n,bw=Math.max(2,gw*0.36),g='';
    for(var i=0;i<=4;i++){
      var y=T0+ih-ih*i/4;
      g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="gt">'+short(max*i/4)+'</text>';
    }
    labels.forEach(function(lb,i){
      if(i%5===0||i===n-1)g+='<text x="'+(L+i*gw+gw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="gt">'+lb+'</text>';
    });
    series.forEach(function(s,j){
      s.vals.forEach(function(v,i){
        var h=v/max*ih;if(h<=0)return;
        g+='<rect x="'+(L+i*gw+gw*0.12+j*bw).toFixed(1)+'" y="'+(T0+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+s.color+'"/>';
      });
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="نمودار">'+g+'</svg>';
  }
  function donutSvg(items,total,unit){
    var R=54,C=2*Math.PI*R,off=0,g='';
    items.forEach(function(it){
      var len=total>0?it.val/total*C:0;
      g+='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+it.color+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';
      off+=len;
    });
    return '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="نمودار دایره‌ای">'+g+
      '<text x="70" y="68" text-anchor="middle" class="dt1">'+short(total)+'</text><text x="70" y="86" text-anchor="middle" class="gt">'+unit+'</text></svg>';
  }

  function readLogo(file,cb){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var S=160,c=document.createElement('canvas');c.width=S;c.height=S;
        var g=c.getContext('2d'),r=Math.max(S/img.width,S/img.height),w=img.width*r,h=img.height*r;
        g.drawImage(img,(S-w)/2,(S-h)/2,w,h);
        var d=c.toDataURL('image/png');
        if(d.length>150000){
          g.globalCompositeOperation='destination-over';g.fillStyle='#ffffff';g.fillRect(0,0,S,S);
          d=c.toDataURL('image/jpeg',0.8);
        }
        cb(d);
      };
      img.onerror=function(){cb('')};
      img.src=fr.result;
    };
    fr.onerror=function(){cb('')};
    fr.readAsDataURL(file);
  }
  function jdate(ts){
    try{

      new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(ts)).forEach(function(x){p[x.type]=x.value});
      return String(p.year).replace(/\D/g,'')+'/'+pad(+p.month)+'/'+pad(+p.day);
    }catch(e){return ''}
  }
  function csvCell(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function csvText(head,rows){return [head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
  function download(name,text,type,bom){

    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},1500);
  }

  /* ---------- cloud: shared data through Firebase ---------- */
  /* every record is its own document in Firestore, so two phones can
     add records at the same time without overwriting each other */
  function stable(o){
    if(o===null||typeof o!=='object')return JSON.stringify(o);
    if(Array.isArray(o))return '['+o.map(stable).join(',')+']';
    return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stable(o[k])}).join(',')+'}';
  }
  function clean(x){return JSON.parse(JSON.stringify(x))}
  function cid(x){return String(x.id)}
  function metaObj(){
    return {open:{AFN:(db.open&&db.open.AFN)||0,USD:(db.open&&db.open.USD)||0},name:db.settings.name,rate:db.settings.rate||0,phone:db.settings.phone||'',address:db.settings.address||'',logo:db.settings.logo||'',target:db.settings.target||0};
  }

  /* called after every change: sends only what changed to the server */
  function persist(){
    savePrefs();
    if(!fs||!user||!ready)return;
    var ops=[];
    COLS.forEach(function(c){
      var local={},prev=synced[c]||{};
      db[c].forEach(function(x){
        var o=clean(x),k=cid(x),s=stable(o);
        local[k]=s;
        if(prev[k]!==s)ops.push({t:'set',ref:fs.collection(c).doc(k),data:o});
      });
      Object.keys(prev).forEach(function(k){
        if(!(k in local))ops.push({t:'del',ref:fs.collection(c).doc(k)});
      });
      synced[c]=local;
    });
    if(role==='admin'){
      var meta=clean(metaObj()),ms=stable(meta);
      if(ms!==metaSynced){ops.push({t:'set',ref:fs.collection('meta').doc('main'),data:meta});metaSynced=ms}
    }
    for(var i=0;i<ops.length;i+=400){
      var b=fs.batch();
      ops.slice(i,i+400).forEach(function(o){if(o.t==='set')b.set(o.ref,o.data);else b['delete'](o.ref)});
      b.commit().catch(function(){toast('ذخیره در سرور نشد. اینترنت را بررسی کن')});
    }
  }

  /* screen refresh after data arrives from another phone */
  function refresh(){
    if(!ready||authState!=='in')return;
    applyTheme();
    if(!TYPING[state.page])render();
  }
  function syncErr(err){
    if(!user||authState==='error')return;
    var c=(err&&err.code)||'';
    gateMsg=c==='permission-denied'?'دسترسی این حساب بسته شده است. با مدیر صحبت کن.':'ارتباط با سرور برقرار نشد. اینترنت را بررسی کن.';
    authState='error';ready=false;render();
  }
  function errH(my){return function(err){if(my===sess)syncErr(err)}}

  function stopSync(){
    sess++;
    unsubs.forEach(function(u){try{u()}catch(e){}});
    unsubs=[];synced={};metaSynced='';ready=false;role='';profile=null;
    db=emptyData();ensure();applyTheme();
  }
  function startSync(){
    var my=++sess;
    /* a worker only writes new records; nothing is read back */
    if(role==='worker'){ready=true;authState='in';applyTheme();render();return}
    var pending=COLS.length+2;
    function fin(){
      pending--;
      if(pending===0){ready=true;authState='in';applyTheme();render()}
    }
    COLS.forEach(function(c){
      var first=true;
      unsubs.push(fs.collection(c).onSnapshot(function(snap){
        if(my!==sess)return;
        var old={},arr=[],map={},changed=snap.size!==db[c].length;
        db[c].forEach(function(x){old[cid(x)]=x});
        snap.forEach(function(d){
          var o=d.data(),k=d.id,s=stable(o),p=old[k];
          map[k]=s;
          if(p&&stable(clean(p))===s)arr.push(p);
          else{arr.push(o);changed=true}
        });
        db[c]=arr;synced[c]=map;rebuildCustomers();
        if(first){first=false;fin()}
        else if(changed)refresh();
      },errH(my)));
    });
    var mfirst=true;
    unsubs.push(fs.collection('meta').doc('main').onSnapshot(function(d){
      if(my!==sess)return;
      var m=d.exists?d.data():{},o=m.open||{};
      db.open={AFN:+o.AFN||0,USD:+o.USD||0};
      db.settings.name=m.name||DEFAULT_NAME;
      db.settings.rate=+m.rate||0;
      db.settings.phone=m.phone||'';db.settings.address=m.address||'';db.settings.target=+m.target||0;
      db.settings.logo=(typeof m.logo==='string'&&m.logo.indexOf('data:image/')===0)?m.logo:'';
      cacheBrand();
      var ms=stable(clean(metaObj())),changed=ms!==metaSynced;
      metaSynced=ms;
      if(mfirst){mfirst=false;fin()}
      else if(changed)refresh();
    },errH(my)));
    var ufirst=true;
    unsubs.push(fs.collection('users').onSnapshot(function(snap){
      if(my!==sess)return;
      var arr=[];
      snap.forEach(function(d){var o=d.data();o.uid=d.id;arr.push(o)});
      var changed=stable(clean(arr))!==stable(clean(db.users));
      db.users=arr;
      if(ufirst){ufirst=false;fin()}
      else if(changed)refresh();
    },errH(my)));
  }

  /* read this person's role; the very first person to sign in becomes the manager */
  function loadProfile(u){
    return fs.collection('users').doc(u.uid).get().then(function(d){
      if(d.exists)return d.data();
      var prof={email:u.email||'',name:'مدیر',role:'admin',createdAt:Date.now()};
      var b=fs.batch();
      b.set(fs.collection('users').doc(u.uid),prof);
      b.set(fs.collection('config').doc('setup'),{owner:u.uid,at:Date.now()});
      return b.commit().then(function(){return prof});
    });
  }
  function profileErr(err){
    var c=(err&&err.code)||'';
    gateMsg=(c==='unavailable')?'ارتباط با سرور برقرار نشد. اینترنت را بررسی کن.':'حساب تو هنوز فعال نشده. از مدیر بخواه برایت کاربر بسازد.';
    authState='error';ready=false;render();
  }

  function initCloud(){
    if(typeof firebase==='undefined'){
      authState='error';gateMsg='اتصال به سرور برقرار نشد. اینترنت را بررسی کن و دوباره تلاش کن.';render();return;
    }
    try{
      firebase.initializeApp(FB);
      auth=firebase.auth();
      fs=firebase.firestore();
      try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    }catch(e){
      authState='error';gateMsg='راه‌اندازی برنامه ناموفق بود. صفحه را دوباره باز کن.';render();return;
    }
    render();
    auth.onAuthStateChanged(function(u){
      stopSync();user=u;
      state.page='home';state.stack=[];state.edit=null;
      if(u){
        authState='sync';render();
        loadProfile(u).then(function(p){
          if(!user||user.uid!==u.uid)return;
          profile=p;
          role=p.role==='worker'?'worker':(p.role==='admin'?'admin':'');
          if(!role){profileErr({code:'no-role'});return}
          startSync();
        }).catch(function(err){
          if(user&&user.uid===u.uid)profileErr(err);
        });
      }else{authState='out';render()}
    });
  }

  initCloud();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14303D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارخانه">
<title>مدیریت کارخانه نایلون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1F4; --surface:#FFFFFF; --ink:#14303D; --text:#14303D; --muted:#5A7480; --line:#D6E1E6;
  --primary:#1B7A9E; --on-primary:#FFFFFF;
  --red:#B93C31; --green:#1F7D57; --gold:#8A6210;
  --t-blue:#DCEEF5; --t-green:#DBEFE4; --t-gold:#FAEDC8; --t-red:#F7DFDB;
  --on-ink:#F1F7F9; --on-ink-muted:#A5BDC7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
    --primary:#5BB8DC; --on-primary:#072028;
    --red:#F0857A; --green:#58C18F; --gold:#F2B632;
    --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#15252D; --ink:#0A2029; --text:#E5EEF1; --muted:#8DA5AF; --line:#26404B;
  --primary:#5BB8DC; --on-primary:#072028;
  --red:#F0857A; --green:#58C18F; --gold:#F2B632;
  --t-blue:#17323E; --t-green:#16332A; --t-gold:#3A3117; --t-red:#3B211F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{
  margin:0;background:var(--bg);color:var(--text);
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{display:inline-block;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pos{color:var(--green)}
.neg{color:var(--red)}

.app{max-width:560px;margin:0 auto;padding-bottom:104px}

/* header */
.top{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);padding:22px 20px 66px}
.top.compact{padding:18px 20px 22px}
.roll{position:absolute;left:-96px;top:-84px;width:290px;height:290px;color:#6FC3E3;opacity:.2;pointer-events:none}
.compact .roll{left:-70px;top:-100px;width:210px;height:210px}
.roll svg{width:100%;height:100%}
.top-row{position:relative;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;font-weight:700;line-height:1.5}
.top .date{margin:0;color:var(--on-ink-muted);font-size:13px}
.chip{flex:none;font-size:12px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--on-ink)}
.back{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:var(--on-ink);display:grid;place-items:center;cursor:pointer}

/* account strip */
.accounts{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:-42px 16px 0;background:var(--surface);border-radius:18px;box-shadow:0 8px 24px rgba(10,32,41,.16)}
.acc{padding:14px 16px}
.acc + .acc{border-inline-start:1px solid var(--line)}
.acc .lbl{display:block;color:var(--muted);font-size:13px}
.acc b{display:block;font-size:22px;font-weight:700;line-height:1.5}
.cur{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 16px 0}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500;cursor:pointer}

/* blocks and rows */
.block{margin:20px 16px 0}
.block h2{margin:0 0 8px;font-size:15px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > :last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
button.row{cursor:pointer}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.ic .icon{width:20px;height:20px}
.tone-green{background:var(--t-green);color:var(--green)}
.tone-blue{background:var(--t-blue);color:var(--primary)}
.tone-gold{background:var(--t-gold);color:var(--gold)}
.tone-red{background:var(--t-red);color:var(--red)}
.main{flex:1;min-width:0}
.main b{display:block;font-weight:500}
.subs{display:flex;flex-wrap:wrap;gap:0 12px}
.sub{color:var(--muted);font-size:13px}
.amt{flex:none;text-align:end;max-width:52%}
.amt b{display:block;font-weight:700}
.tag{display:inline-block;font-size:12px;line-height:1.7;padding:0 8px;border-radius:999px}
.tag.debt{background:var(--t-red);color:var(--red)}
.tag.paid{background:var(--t-green);color:var(--green)}
.tag.info{background:var(--t-blue);color:var(--primary)}
.chev{width:18px;height:18px;color:var(--muted)}
.chev .icon{width:18px;height:18px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--t-blue);color:var(--primary)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--t-blue);color:var(--primary);margin-top:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-radius:14px;background:var(--t-red);color:var(--red)}
.sum b{font-size:20px;text-align:end}
.sum b span.blk{display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--t-blue)}
.seg button{padding:8px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700}
.rep{display:grid;grid-template-columns:1.1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}
.c.h{background:var(--t-blue);color:var(--muted);font-size:13px}
.c.l{text-align:start;padding-inline-start:14px;font-weight:500}
.c.res{font-weight:700;border-bottom:0}
.note{margin:10px 2px 0;color:var(--muted);font-size:13px}

/* form */
.form .fld{margin-bottom:16px}
.fld > label,.fld > .lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;line-height:1.5}
.inp::placeholder{color:var(--muted);opacity:.8}
.rollrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rollrow .hd{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.rollrow .hd b{font-weight:500}
.rollrow .rp{flex:1;text-align:end;font-size:14px}
.mini{display:block;font-size:12.5px;color:var(--muted)}
.mini .inp{margin-top:4px}
.x{width:34px;height:34px;border:0;border-radius:10px;background:var(--t-red);color:var(--red);font-size:20px;line-height:1;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 16px;padding:14px 16px;border-radius:14px;background:var(--t-blue)}
.total b{font-size:24px}
.chips{display:flex;gap:8px;margin-top:8px}
.chips.wrap{flex-wrap:wrap}
.pillbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pillbtn{padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.due{margin:-4px 2px 14px;font-weight:500;min-height:1.7em}
.err{margin:0 0 12px;color:var(--red)}
.err:empty{display:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--t-blue)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ink);color:var(--on-ink);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-more" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M18 14.3c1.8.8 3 2.5 3 4.7"/></symbol>

</svg>

<div class="app"><main id="view"></main></div>

<nav class="tabbar" aria-label="منوی اصلی">
  <div class="tabs" id="tabs"></div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var DIG='۰۱۲۳۴۵۶۷۸۹';
  var CUR={AFN:'افغانی',USD:'دالر'};

  /* ---------- helpers ---------- */
  function fa(s){return String(s).replace(/\d/g,function(d){return DIG[d]})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(v){return Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2})}
  function N(v){return '<span class="n">'+(v<0?'−':'')+fa(fmt(v))+'</span>'}
  function T(s){return '<span class="n">'+fa(s)+'</span>'}
  function icon(n){return '<svg class="icon" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
  function cur(c){return '<span class="cur">'+c+'</span>'}
  function sum(a,k){return a.reduce(function(t,x){return t+(x[k]||0)},0)}
  function r2(v){return Math.round(v*100)/100}
  function by(arr,f){
    var r={AFN:0,USD:0};
    arr.forEach(function(x){r[x.cur||'AFN']+=f(x)});
    r.AFN=r2(r.AFN);r.USD=r2(r.USD);return r;
  }
  function parse(s){
    s=String(s||'')
      .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
      .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
      .replace(/[,٬،\s]/g,'').replace(/٫/g,'.');
    var v=parseFloat(s);return isFinite(v)?v:0;
  }
  function pad(n){return (n<10?'0':'')+n}
  function timeText(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
  function isToday(ts){return dayKey(ts)===dayKey(Date.now())}
  function pdate(ts,o){
    var locs=['fa-AF-u-ca-persian','fa-IR-u-ca-persian'];
    for(var i=0;i<locs.length;i++){
      try{return fa(new Intl.DateTimeFormat(locs[i],o).format(new Date(ts)))}catch(e){}
    }
    return '';
  }
  function dayLabel(ts){
    if(isToday(ts))return 'امروز';
    if(dayKey(ts)===dayKey(Date.now()-864e5))return 'دیروز';
    return pdate(ts,{day:'numeric',month:'long'});
  }
  function monthKey(ts){
    try{return new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric'}).format(new Date(ts))}
    catch(e){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()}
  }

  /* ---------- data (saved on this device) ---------- */
  var KEY='nylon-factory-app-v1';
  function at(daysAgo,h,m){var d=new Date();d.setDate(d.getDate()-daysAgo);d.setHours(h,m,0,0);return d.getTime()}
  function emptyData(){
    return {sample:false,open:{AFN:0,USD:0},seq:1,customers:[],sales:[],buys:[],exps:[],pays:[]};
  }
  function sampleData(){
    return {
      sample:true,open:{AFN:1000000,USD:10000},seq:100,
      customers:[{name:'احمد کریمی'},{name:'حاجی نصیر'},{name:'رحمت‌الله'},{name:'شرکت آریانا'},{name:'مرادی'}],
      sales:[
        {id:1,ts:at(0,8,30),name:'احمد کریمی',cur:'AFN',rolls:25,kg:900,total:126000,paid:76000},
        {id:2,ts:at(0,10,5),name:'حاجی نصیر',cur:'AFN',rolls:12,kg:430,total:60200,paid:60200},
        {id:3,ts:at(0,11,20),name:'رحمت‌الله',cur:'AFN',rolls:40,kg:1500,total:210000,paid:100000},
        {id:4,ts:at(1,15,0),name:'شرکت آریانا',cur:'AFN',rolls:60,kg:2100,total:294000,paid:294000},
        {id:5,ts:at(1,11,30),name:'مرادی',cur:'AFN',rolls:18,kg:650,total:91000,paid:16000}
      ],
      buys:[
        {id:1,ts:at(1,9,0),name:'پلاستیک خام، تاجر خالد',ton:3,amt:2400,cur:'USD'},
        {id:2,ts:at(7,10,0),name:'پلاستیک خام، شرکت نوین',ton:5,amt:4000,cur:'USD'},
        {id:3,ts:at(8,10,0),name:'رنگ و مواد افزودنی',ton:1,amt:900,cur:'USD'}
      ],
      exps:[
        {id:1,ts:at(0,9,40),name:'برق',cat:'خدمات',amt:12000,cur:'AFN'},
        {id:2,ts:at(0,9,10),name:'کرایه موتر',cat:'حمل',amt:3500,cur:'AFN'},
        {id:3,ts:at(0,8,50),name:'چای و خوراک کارگران',cat:'خوراک',amt:1800,cur:'AFN'},
        {id:4,ts:at(1,17,0),name:'معاش کارگران',cat:'معاش',amt:85000,cur:'AFN'}
      ]
    };
  }
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.sales&&d.customers)return d}}catch(e){}
    return null;
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
  var db=load()||sampleData();
  if(!db.pays)db.pays=[];

  function balance(c){
    var v=(db.open&&db.open[c])||0;
    db.sales.forEach(function(s){if((s.cur||'AFN')===c)v+=s.paid});
    db.buys.forEach(function(b){if((b.cur||'AFN')===c)v-=b.amt});
    db.exps.forEach(function(x){if((x.cur||'AFN')===c)v-=x.amt});
    db.pays.forEach(function(p){if((p.cur||'AFN')===c)v+=p.amt});
    return r2(v);
  }
  function custInfo(c){
    var ss=db.sales.filter(function(s){return s.name===c.name});
    var d=by(ss,function(s){return s.total-s.paid});
    db.pays.forEach(function(p){if(p.name===c.name){var k=p.cur||'AFN';d[k]=r2(d[k]-p.amt)}});
    var last=ss.reduce(function(m,s){return Math.max(m,s.ts)},0);
    return {name:c.name,d:d,last:last};
  }
  function totalDebt(){
    var d=by(db.sales,function(s){return s.total-s.paid});
    db.pays.forEach(function(p){var k=p.cur||'AFN';d[k]=r2(d[k]-p.amt)});
    return d;
  }
  function hasDebt(ci){return ci.d.AFN>0||ci.d.USD>0}
  function amts(a,u){
    var out='';
    if(a)out+='<b>'+N(a)+cur(CUR.AFN)+'</b>';
    if(u)out+='<b>'+N(u)+cur(CUR.USD)+'</b>';
    return out||'<b>'+N(0)+cur(CUR.AFN)+'</b>';
  }
  function dueText(d){
    var p=[];
    if(d.AFN>0)p.push(N(d.AFN)+' '+CUR.AFN);
    if(d.USD>0)p.push(N(d.USD)+' '+CUR.USD);
    return p.join(' و ');
  }

  /* ---------- state and shell ---------- */
  var state={page:'home',prev:'home',rep:'day'};
  var view=document.getElementById('view');
  var tabsEl=document.getElementById('tabs');
  var toastEl=document.getElementById('toast');
  var toastTimer,clearArmed=false,clearTimer;

      var items=db.sales.filter(function(x){return x.name===name}).map(function(x){return {ts:x.ts,k:'s',x:x}})
        .concat(db.pays.filter(function(x){return x.name===name}).map(function(x){return {ts:x.ts,k:'p',x:x}}))

      var rows=items.map(function(it){

      var dc=d.AFN>0?'AFN':'USD';
      var form=hasDebt(info)?
        '<div class="block form" id="pf"><h2>دریافت پول از مشتری</h2>'+
          '<div class="fld"><span class="lbl">واحد پول</span><div class="seg" data-seg="cur" role="group" aria-label="واحد پول">'+
            '<button type="button" data-v="AFN" aria-pressed="'+(dc==='AFN')+'">افغانی</button><button type="button" data-v="USD" aria-pressed="'+(dc==='USD')+'">دالر</button></div></div>'+
          '<div class="fld"><label for="p-amt">مبلغ دریافتی</label><input class="inp" id="p-amt" inputmode="decimal" autocomplete="off">'+
            '<div class="chips"><button type="button" class="pillbtn" id="p-all">همه باقی</button></div></div>'+
          '<div class="due" id="p-due"></div>'+
          '<p class="err" id="p-err" role="alert"></p>'+
          '<button type="button" class="btn" id="p-save">ثبت دریافت</button></div>':'';
      return top(esc(name),{back:true,sub:'صورت‌حساب مشتری'})+
        '<div class="block">'+(t?'<div class="sum"><span>باقی‌دار است</span><b>'+t+'</b></div>':'<div class="sum" style="background:var(--t-green);color:var(--green)"><span>حساب تسویه است</span><b>'+N(0)+'</b></div>')+'</div>'+
        form+
        '<div class="block"><h2>تاریخچه</h2>'+(rows?'<div class="list">'+rows+'</div>':'<div class="empty">هنوز حرکتی ثبت نشده.</div>')+'</div>';
    }
  };
  var EXP_CATS=['معاش','خدمات','حمل','خوراک','تعمیرات','دیگر'];

  /* ---------- sales form ---------- */
  function bindForm(){
    var f=document.getElementById('sf');if(!f)return;
    var sel={cur:'AFN',mode:'roll',unit:'kg'},follow=true;
    var rollsEl=f.querySelector('#rolls'),paidEl=f.querySelector('#f-paid'),errEl=f.querySelector('#f-err');

    function rows(){return Array.prototype.slice.call(rollsEl.querySelectorAll('.rollrow'))}
    function renumber(){rows().forEach(function(r,i){r.querySelector('.rn').textContent=fa(i+1)})}
    function addRoll(rate){
      var d=document.createElement('div');d.className='rollrow';
      d.innerHTML='<div class="hd"><b>رول <span class="n rn"></span></b><span class="rp muted"></span>'+
        '<button type="button" class="x" data-x aria-label="حذف این رول">×</button></div>'+
        '<label class="mini">وزن (کیلو)<input class="inp rw" inputmode="decimal" autocomplete="off"></label>'+
        '<label class="mini">نرخ هر کیلو<input class="inp rr" inputmode="decimal" autocomplete="off"></label>';
      d.querySelector('.rr').value=rate||'';
      rollsEl.appendChild(d);renumber();
    }
    function applySel(g){
      if(g==='mode'){
        f.querySelector('#sec-roll').hidden=sel.mode!=='roll';
        f.querySelector('#sec-weight').hidden=sel.mode!=='weight';
      }
      if(g==='unit'){
        var u=sel.unit==='ton'?'تُن':'کیلو';
        f.querySelector('#w-qty-l').textContent='مقدار ('+u+')';
        f.querySelector('#w-rate-l').textContent='نرخ هر '+u;
      }
    }
    function calc(){
      var total=0,kg=0,rolls=0,bad=false,items=[];
      if(sel.mode==='roll'){
        rows().forEach(function(r){
          var wi=r.querySelector('.rw'),ri=r.querySelector('.rr'),lp=r.querySelector('.rp');
          var w=parse(wi.value),p=parse(ri.value);
          if(w>0&&p>0){
            var pr=r2(w*p);total+=pr;kg+=w;rolls++;items.push({w:w,rate:p,price:pr});
            lp.innerHTML=N(pr)+cur(CUR[sel.cur]);
          }else{
            lp.textContent='';
            if(wi.value.trim()||ri.value.trim())bad=true;
          }
        });
      }else{
        var q=parse(f.querySelector('#w-qty').value),rt=parse(f.querySelector('#w-rate').value);
        kg=q*(sel.unit==='ton'?1000:1);total=q*rt;
      }
      total=r2(total);kg=r2(kg);
      f.querySelector('#f-total').innerHTML=N(total)+cur(CUR[sel.cur]);
      if(follow)paidEl.value=total>0?String(total):'';
      var paid=parse(paidEl.value),due=r2(total-paid),dueEl=f.querySelector('#f-due');
      if(total>0)dueEl.innerHTML=due>0?'<span class="neg">باقی: '+N(due)+cur(CUR[sel.cur])+'</span>':'<span class="pos">تسویه کامل</span>';
      else dueEl.textContent='';
      return {total:total,kg:kg,rolls:rolls,bad:bad,items:items};
    }
    function saveSale(){
      var name=f.querySelector('#f-cust').value.trim(),r=calc(),paid=r2(parse(paidEl.value)),err='';
      if(!name)err='نام مشتری را بنویس.';
      else if(r.bad)err='برای هر رول، هم وزن و هم نرخ را وارد کن.';
      else if(!(r.total>0))err=sel.mode==='roll'?'حداقل یک رول با وزن و نرخ وارد کن.':'مقدار و نرخ را وارد کن.';
      else if(paid<0||paid>r.total+0.001)err='مبلغ دریافتی باید بین صفر و مجموع باشد.';
      errEl.textContent=err;
      if(err)return;
      var sale={id:db.seq++,ts:Date.now(),name:name,cur:sel.cur,mode:sel.mode,rolls:r.rolls,kg:r.kg,total:r.total,paid:paid};
      if(sel.mode==='roll')sale.items=r.items;
      db.sales.push(sale);
      if(!db.customers.some(function(c){return c.name===name}))db.customers.push({name:name});
      persist();toast('فروش ذخیره شد');go('sales');
    }

    f.addEventListener('input',function(e){
      if(e.target===paidEl)follow=false;
      errEl.textContent='';calc();
    });
    f.addEventListener('click',function(e){
      var sb=e.target.closest('[data-seg] button');
      if(sb){
        var g=sb.parentNode.dataset.seg;sel[g]=sb.dataset.v;
        Array.prototype.forEach.call(sb.parentNode.children,function(b){b.setAttribute('aria-pressed',b===sb?'true':'false')});
        applySel(g);calc();return;
      }
      if(e.target.closest('#add-roll')){
        var rs=rows();addRoll(rs.length?rs[rs.length-1].querySelector('.rr').value:'');
        calc();rows().pop().querySelector('.rw').focus();return;
      }
      var x=e.target.closest('[data-x]');
      if(x){
        if(rows().length>1){x.closest('.rollrow').remove();renumber();calc()}
        else toast('حداقل یک رول لازم است');
        return;
      }
      if(e.target.closest('#paid-all')){follow=true;calc();return}
      if(e.target.closest('#paid-none')){follow=false;paidEl.value='0';calc();return}
      if(e.target.closest('#f-save'))saveSale();
    });
    addRoll('');calc();
  }

  /* ---------- purchase, expense and payment forms ---------- */
  function segClick(e,sel){
    var sb=e.target.closest('[data-seg] button');if(!sb)return false;
    var g=sb.parentNode.dataset.seg;sel[g]=sb.dataset.v;
    Array.prototype.forEach.call(sb.parentNode.children,function(b){b.setAttribute('aria-pressed',b===sb?'true':'false')});
    return g;
  }
  function bindBuy(){
    var f=document.getElementById('bf');if(!f)return;
    var sel={cur:'USD',unit:'ton'},errEl=f.querySelector('#b-err');
    function unitLabel(){f.querySelector('#b-qty-l').textContent='مقدار ('+(sel.unit==='ton'?'تُن':'کیلو')+')'}
    function show(){var a=parse(f.querySelector('#b-amt').value);f.querySelector('#b-show').innerHTML=a>0?N(a)+cur(CUR[sel.cur]):''}
    f.addEventListener('input',function(){errEl.textContent='';show()});
    f.addEventListener('click',function(e){
      var g=segClick(e,sel);
      if(g){if(g==='unit')unitLabel();show();return}
      if(!e.target.closest('#b-save'))return;
      var name=f.querySelector('#b-name').value.trim(),q=parse(f.querySelector('#b-qty').value),a=r2(parse(f.querySelector('#b-amt').value)),err='';
      if(!name)err='جنس و فروشنده را بنویس.';
      else if(!(q>0))err='مقدار را وارد کن.';
      else if(!(a>0))err='مبلغ خرید را وارد کن.';
      errEl.textContent=err;if(err)return;
      var ton=sel.unit==='ton'?q:q/1000;
      db.buys.push({id:db.seq++,ts:Date.now(),name:name,ton:Math.round(ton*1000)/1000,amt:a,cur:sel.cur});
      persist();toast('خرید ذخیره شد');go('buy');
    });
    unitLabel();show();
  }
  function bindExp(){
    var f=document.getElementById('ef');if(!f)return;
    var sel={cur:'AFN'},cat=EXP_CATS[0],errEl=f.querySelector('#e-err');
    function show(){var a=parse(f.querySelector('#e-amt').value);f.querySelector('#e-show').innerHTML=a>0?N(a)+cur(CUR[sel.cur]):''}
    f.addEventListener('input',function(){errEl.textContent='';show()});
    f.addEventListener('click',function(e){
      if(segClick(e,sel)){show();return}
      var cb=e.target.closest('[data-cat]');
      if(cb){cat=cb.dataset.cat;Array.prototype.forEach.call(cb.parentNode.children,function(b){b.setAttribute('aria-pressed',b===cb?'true':'false')});return}
      if(!e.target.closest('#e-save'))return;
      var name=f.querySelector('#e-name').value.trim(),a=r2(parse(f.querySelector('#e-amt').value)),err='';
      if(!name)err='توضیح مصرف را بنویس.';
      else if(!(a>0))err='مبلغ را وارد کن.';
      errEl.textContent=err;if(err)return;
      db.exps.push({id:db.seq++,ts:Date.now(),name:name,cat:cat,amt:a,cur:sel.cur});
      persist();toast('مصرف ذخیره شد');go('exp');
    });
    show();
  }
  function bindPay(){
    var f=document.getElementById('pf');if(!f)return;
    var name=state.cust,amtEl=f.querySelector('#p-amt'),errEl=f.querySelector('#p-err'),dueEl=f.querySelector('#p-due');
    var sel={cur:f.querySelector('[data-seg="cur"] [aria-pressed="true"]').dataset.v};
    function owed(){return custInfo({name:name}).d[sel.cur]||0}
    function show(){
      var o=owed(),a=parse(amtEl.value);
      if(o<=0){dueEl.innerHTML='<span class="muted">در این پول باقی‌داری نیست.</span>';return}
      var rest=r2(o-a);
      dueEl.innerHTML=a>0&&rest>=0?(rest>0?'<span class="neg">بعد از این باقی: '+N(rest)+cur(CUR[sel.cur])+'</span>':'<span class="pos">تسویه کامل</span>'):'<span class="muted">باقی: '+N(o)+cur(CUR[sel.cur])+'</span>';
    }
    f.addEventListener('input',function(){errEl.textContent='';show()});
    f.addEventListener('click',function(e){
      if(segClick(e,sel)){amtEl.value='';show();return}
      if(e.target.closest('#p-all')){var o=owed();amtEl.value=o>0?String(o):'';show();return}
      if(!e.target.closest('#p-save'))return;
      var a=r2(parse(amtEl.value)),o=owed(),err='';
      if(!(a>0))err='مبلغ دریافتی را وارد کن.';
      else if(a>o+0.001)err='مبلغ نباید از باقی‌داری بیشتر باشد.';
      errEl.textContent=err;if(err)return;
      db.pays.push({id:db.seq++,ts:Date.now(),name:name,cur:sel.cur,amt:a});
      persist();toast('دریافت ثبت شد');render();window.scrollTo(0,0);
    });
    show();
  }

  /* ---------- navigation ---------- */
  function render(){
    view.innerHTML=pages[state.page]();
    var here=TAB_OF[state.page];
    Array.prototype.forEach.call(tabsEl.children,function(b){
      if(b.dataset.go===here)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    if(state.page==='newsale')bindForm();
    else if(state.page==='newbuy')bindBuy();
    else if(state.page==='newexp')bindExp();
    else if(state.page==='cust')bindPay();
  }
  function go(p){
    if(p==='back'){p=state.prev||'home'}else{state.prev=state.page}
    state.page=p;render();window.scrollTo(0,0);
  }
  function toast(msg){
    toastEl.textContent=msg;toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2400);
  }

  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]');if(g){if(g.dataset.cust!==undefined)state.cust=g.dataset.cust;go(g.dataset.go);return}
    var t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
    var r=e.target.closest('[data-rep]');if(r){state.rep=r.dataset.rep;render();return}
    var a=e.target.closest('[data-action]');
    if(a&&a.dataset.action==='clear'){
      if(clearArmed){
        db=emptyData();persist();clearArmed=false;render();toast('اطلاعات نمونه پاک شد');
      }else{
        clearArmed=true;toast('برای پاک کردن اطلاعات نمونه، دوباره بزن');
        clearTimeout(clearTimer);clearTimer=setTimeout(function(){clearArmed=false},5000);
      }
    }
  });

  render();
})();
</script>
</body>
</html>
